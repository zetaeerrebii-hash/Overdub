<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERDUB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --accent: #ff3c3c;
    --accent2: #ff8c00;
    --text: #e8e8e8;
    --muted: #555;
    --track-h: 54px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 24px;
  }

  header {
    text-align: center;
    letter-spacing: 0.18em;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 6rem);
    color: var(--accent);
    line-height: 1;
    text-shadow: 4px 4px 0 #5a0000;
  }

  .subtitle { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.3em; margin-top: 4px; }

  /* Transport */
  .transport {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 4px;
    width: 100%;
    max-width: 680px;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    border: 1px solid var(--border);
    background: #1e1e1e;
    color: var(--text);
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.1s;
    user-select: none;
  }
  .btn:hover { background: #2a2a2a; border-color: #444; }
  .btn:active { transform: scale(0.97); }

  .btn-rec {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-rec:hover { background: #ff5555; }
  .btn-rec.recording { animation: pulse-btn 1s infinite; }

  @keyframes pulse-btn {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,60,60,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,60,60,0); }
  }

  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .recording .rec-dot { animation: blink 0.7s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .btn-play { background: #1a3a1a; border-color: #2d6b2d; color: #6dff6d; }
  .btn-play:hover { background: #234823; }

  .btn-recplay {
    background: linear-gradient(135deg, #5a0000 0%, #1a2a00 100%);
    border-color: #7a3a00;
    color: #ffcc44;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.62rem;
  }
  .btn-recplay:hover { background: linear-gradient(135deg, #6a0000 0%, #223300 100%); border-color: #aa5500; }
  .btn-recplay.recording { animation: pulse-btn 1s infinite; border-color: var(--accent); }

  .btn-stop { background: #2a1a1a; border-color: #6b2d2d; color: #ff8888; }
  .btn-stop:hover { background: #3a2020; }

  .time-display {
    margin-left: auto;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
  }

  /* VU meter */
  .vu-wrap {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vu-label { font-size: 0.6rem; color: var(--muted); min-width: 24px; text-align: right; }
  .vu-bar {
    flex: 1;
    height: 8px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .vu-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2d6b2d 60%, #ffaa00 80%, #ff3c3c 100%);
    border-radius: 2px;
    transition: width 0.05s;
  }

  /* Tracks */
  .tracks-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.25em;
    align-self: flex-start;
    width: 100%;
    max-width: 680px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .tracks {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  .track {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    height: var(--track-h);
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
    animation: slide-in 0.2s ease;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .track-num {
    width: 32px;
    font-size: 0.6rem;
    color: var(--muted);
    text-align: center;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .track-waveform {
    flex: 1;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .track-waveform canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .track-controls {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 8px;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
  }

  .track-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    border: 1px solid var(--border);
    background: #1e1e1e;
    color: var(--muted);
    padding: 3px 8px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    transition: all 0.1s;
  }
  .track-btn:hover { color: var(--text); border-color: #555; }
  .track-btn.muted { color: #ff8888; border-color: #6b2d2d; background: #1a1212; }
  .track-btn.solo  { color: #ffe066; border-color: #7a6a00; background: #1a1800; }
  .track-btn.del   { color: #ff3c3c; }
  .track-btn.del:hover { background: #2a1212; }

  .vol-slider {
    width: 64px;
    accent-color: var(--accent2);
    cursor: pointer;
  }

  /* Mix/Export */
  .actions {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 680px;
  }

  .btn-mix {
    flex: 1;
    background: linear-gradient(135deg, #1a2a3a, #0d1a2a);
    border-color: #1e4d7a;
    color: #4da6ff;
    font-size: 0.65rem;
  }
  .btn-mix:hover { background: linear-gradient(135deg, #1e3448, #102035); }

  .btn-clear {
    background: transparent;
    border-color: #3a2020;
    color: #884444;
    font-size: 0.65rem;
  }
  .btn-clear:hover { border-color: #6b2d2d; color: var(--accent); background: #1a0e0e; }

  .empty-hint {
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-align: center;
    padding: 20px 0;
    border: 1px dashed #222;
    border-radius: 3px;
    width: 100%;
  }

  .status-bar {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
  }

  #status { color: var(--accent2); }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-label { font-size: 0.6rem; color: var(--muted); min-width: 32px; text-align: right; }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: #1a1a1a;
    border-radius: 3px;
    overflow: visible;
    border: 1px solid var(--border);
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2) 0%, var(--accent) 100%);
    border-radius: 3px;
    transition: width 0.1s linear;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,140,0,0.9);
    display: none;
  }
  .progress-fill.active::after { display: block; }
  .progress-fill.rec-mode {
    background: linear-gradient(90deg, #880000 0%, var(--accent) 100%);
  }
  .progress-fill.rec-mode::after { box-shadow: 0 0 6px rgba(255,60,60,1); background: var(--accent); }
  .progress-dur { font-size: 0.58rem; color: var(--muted); min-width: 36px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header>
  <h1>OVERDUB</h1>
  <div class="subtitle">MULTI-TRACK RECORDER</div>
</header>

<!-- VU meter -->
<div class="vu-wrap">
  <span class="vu-label">IN</span>
  <div class="vu-bar"><div class="vu-fill" id="vuFill"></div></div>
</div>

<!-- Progress bar -->
<div class="progress-wrap">
  <span class="progress-label">POS</span>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <span class="progress-dur" id="progressDur">0:00</span>
</div>

<!-- Transport -->
<div class="transport">
  <button class="btn btn-rec" id="btnRec" onclick="toggleRecord()">
    <span class="rec-dot"></span> REC
  </button>
  <button class="btn btn-recplay" id="btnRecPlay" onclick="toggleRecPlay()">
    <span class="rec-dot"></span> REC+PLAY
  </button>
  <button class="btn btn-play" onclick="playAll()">▶ PLAY</button>
  <button class="btn btn-stop" onclick="stopAll()">■ STOP</button>
  <div class="time-display" id="timeDisplay">00:00.0</div>
</div>

<!-- Tracks -->
<div class="tracks-label">TRACCE</div>
<div class="tracks" id="tracks">
  <div class="empty-hint" id="emptyHint">Premi REC per registrare la prima traccia</div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-mix" onclick="mixAndDownload()">⬇ SCARICA MIX</button>
  <button class="btn btn-clear" onclick="clearAll()">✕ CANCELLA TUTTO</button>
</div>

<div class="status-bar">
  <span id="status">PRONTO</span>
  <span id="trackCount">0 tracce</span>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let tracks = [];
let mediaStream = null;
let mediaRecorder = null;
let audioCtx = null;
let analyser = null;
let isRecording = false;
let isPlaying = false;
let startTime = 0;        // AudioContext time when playback/rec started
let startWallTime = 0;    // performance.now() reference
let elTimer = null;
let progressAnim = null;
let recordedChunks = [];
let vuAnim = null;
let totalDuration = 0;    // max track duration for progress bar

// ─── Audio context ────────────────────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ─── Timer & Progress ─────────────────────────────────────────────────────────
function startTimer(dur) {
  startWallTime = performance.now();
  totalDuration = dur || 0;
  clearInterval(elTimer);
  cancelAnimationFrame(progressAnim);

  const fill = document.getElementById('progressFill');
  const durEl = document.getElementById('progressDur');
  fill.classList.add('active');

  function tick() {
    const elapsed = (performance.now() - startWallTime) / 1000;

    // time display
    const m = Math.floor(elapsed / 60);
    const sec = (elapsed % 60).toFixed(1).padStart(4, '0');
    document.getElementById('timeDisplay').textContent =
      String(m).padStart(2,'0') + ':' + sec;

    // progress bar
    if (totalDuration > 0) {
      const pct = Math.min(100, (elapsed / totalDuration) * 100);
      fill.style.width = pct + '%';
      // remaining
      const rem = Math.max(0, totalDuration - elapsed);
      const rm = Math.floor(rem / 60);
      const rs = Math.floor(rem % 60).toString().padStart(2,'0');
      durEl.textContent = rm + ':' + rs;
    } else {
      // recording — grow bar slowly, no end
      const fakeWidth = Math.min(95, (elapsed / 60) * 100);
      fill.style.width = fakeWidth + '%';
      const em = Math.floor(elapsed / 60);
      const es = Math.floor(elapsed % 60).toString().padStart(2,'0');
      durEl.textContent = em + ':' + es;
    }

    progressAnim = requestAnimationFrame(tick);
  }
  progressAnim = requestAnimationFrame(tick);
}

function stopTimer() {
  cancelAnimationFrame(progressAnim);
}

function resetTimer() {
  stopTimer();
  document.getElementById('timeDisplay').textContent = '00:00.0';
  const fill = document.getElementById('progressFill');
  fill.style.width = '0%';
  fill.classList.remove('active', 'rec-mode');
  document.getElementById('progressDur').textContent = '0:00';
}

// ─── VU Meter ────────────────────────────────────────────────────────────────
function startVU(stream) {
  const ctx = getCtx();
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  const fill = document.getElementById('vuFill');
  function frame() {
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0)/data.length;
    fill.style.width = Math.min(100, avg * 2.2) + '%';
    vuAnim = requestAnimationFrame(frame);
  }
  vuAnim = requestAnimationFrame(frame);
}
function stopVU() {
  cancelAnimationFrame(vuAnim);
  document.getElementById('vuFill').style.width = '0%';
}

// ─── Record ───────────────────────────────────────────────────────────────────
function getSupportedMimeType() {
  const types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
    'audio/mp4',
    ''
  ];
  for (const type of types) {
    if (type === '' || MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

async function startRecording(withPlayback) {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true,
      noiseSuppression: true,
      sampleRate: 44100
    }});
  } catch(e) {
    setStatus('Errore mic: ' + (e.name || e.message));
    console.error(e);
    return;
  }

  // Stop any current playback
  tracks.forEach(t => { try { t.sourceNode?.stop(); } catch(e){} t.sourceNode = null; t.gainNode = null; });
  isPlaying = false;

  recordedChunks = [];
  const mimeType = getSupportedMimeType();
  try {
    mediaRecorder = mimeType
      ? new MediaRecorder(mediaStream, { mimeType })
      : new MediaRecorder(mediaStream);
  } catch(e) {
    mediaRecorder = new MediaRecorder(mediaStream);
  }
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = finishRecording;
  mediaRecorder.onerror = e => { setStatus('Errore rec: ' + e.error); };
  mediaRecorder.start(100);
  isRecording = true;

  const dur = tracks.length > 0 ? Math.max(...tracks.map(t => t.buffer?.duration || 0)) : 0;

  // Play existing tracks as reference (overdub mode)
  if (withPlayback && tracks.length > 0) {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const anySolo = tracks.some(t => t.solo);
    tracks.forEach(t => {
      if (!t.buffer) return;
      const src = ctx.createBufferSource();
      src.buffer = t.buffer;
      const gain = ctx.createGain();
      gain.gain.value = (!t.muted && (!anySolo || t.solo)) ? t.gain : 0;
      src.connect(gain).connect(ctx.destination);
      src.start(0);
      t.sourceNode = src;
      t.gainNode = gain;
    });
    setStatus('● REC + PLAY — canta sopra!');
  } else {
    setStatus('● REGISTRAZIONE...');
  }

  startVU(mediaStream);
  document.getElementById('progressFill').classList.add('rec-mode');
  startTimer(dur);
}

async function toggleRecord() {
  if (isRecording) { stopRecording(); return; }
  document.getElementById('btnRec').classList.add('recording');
  document.getElementById('btnRecPlay').classList.remove('recording');
  await startRecording(false);
}

async function toggleRecPlay() {
  if (isRecording) { stopRecording(); return; }
  if (tracks.length === 0) { setStatus('Prima registra una traccia base!'); return; }
  document.getElementById('btnRecPlay').classList.add('recording');
  document.getElementById('btnRec').classList.remove('recording');
  await startRecording(true);
}

async function finishRecording() {
  if (recordedChunks.length === 0) { setStatus('Nessun dato registrato'); return; }
  const mimeType = (recordedChunks[0] && recordedChunks[0].type) ? recordedChunks[0].type : 'audio/webm';
  const blob = new Blob(recordedChunks, { type: mimeType });
  const ab = await blob.arrayBuffer();
  const ctx = getCtx();
  try {
    const buffer = await ctx.decodeAudioData(ab);
    addTrack(buffer);
    setStatus('Traccia aggiunta ✓');
  } catch(e) {
    console.error('decodeAudioData error:', e, 'mimeType:', mimeType);
    setStatus('Errore decodifica (' + mimeType + '): ' + e.message);
  }
}

// ─── Tracks ───────────────────────────────────────────────────────────────────
function addTrack(buffer) {
  const idx = tracks.length;
  tracks.push({ buffer, gain: 1, muted: false, solo: false, sourceNode: null, gainNode: null });
  document.getElementById('emptyHint')?.remove();
  renderTrack(idx);
  updateTrackCount();
}

function renderTrack(idx) {
  const t = tracks[idx];
  const el = document.createElement('div');
  el.className = 'track';
  el.id = 'track-' + idx;

  // waveform
  const canvas = document.createElement('canvas');
  canvas.width = 500; canvas.height = 54;

  el.innerHTML = `
    <div class="track-num">${idx+1}</div>
    <div class="track-waveform"></div>
    <div class="track-controls">
      <div style="display:flex;gap:4px">
        <button class="track-btn" id="mute-${idx}" onclick="toggleMute(${idx})">MUTE</button>
        <button class="track-btn" id="solo-${idx}" onclick="toggleSolo(${idx})">SOLO</button>
        <button class="track-btn del" onclick="deleteTrack(${idx})">✕</button>
      </div>
      <input type="range" class="vol-slider" id="vol-${idx}" min="0" max="2" step="0.05" value="1"
        oninput="setVol(${idx},this.value)" title="Volume">
    </div>
  `;
  el.querySelector('.track-waveform').appendChild(canvas);
  drawWaveform(canvas, t.buffer);

  document.getElementById('tracks').appendChild(el);
}

function drawWaveform(canvas, buffer) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / w);
  const mid = h / 2;

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);

  // grid line
  ctx.strokeStyle = '#1f1f1f';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

  ctx.strokeStyle = '#ff3c3c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < w; x++) {
    let min = 0, max = 0;
    for (let i = 0; i < step; i++) {
      const v = data[x * step + i] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    ctx.moveTo(x, mid + min * mid * 0.9);
    ctx.lineTo(x, mid + max * mid * 0.9);
  }
  ctx.stroke();
}

function toggleMute(idx) {
  tracks[idx].muted = !tracks[idx].muted;
  const btn = document.getElementById('mute-'+idx);
  btn.classList.toggle('muted', tracks[idx].muted);
  if (tracks[idx].gainNode) {
    tracks[idx].gainNode.gain.value = tracks[idx].muted ? 0 : tracks[idx].gain;
  }
}

function toggleSolo(idx) {
  tracks[idx].solo = !tracks[idx].solo;
  document.getElementById('solo-'+idx).classList.toggle('solo', tracks[idx].solo);
  applyGains();
}

function applyGains() {
  const anySolo = tracks.some(t => t.solo);
  tracks.forEach((t, i) => {
    if (t.gainNode) {
      const active = !t.muted && (!anySolo || t.solo);
      t.gainNode.gain.value = active ? t.gain : 0;
    }
  });
}

function setVol(idx, val) {
  tracks[idx].gain = parseFloat(val);
  if (tracks[idx].gainNode && !tracks[idx].muted) {
    tracks[idx].gainNode.gain.value = tracks[idx].gain;
  }
}

function deleteTrack(idx) {
  stopAll();
  tracks[idx].buffer = null;
  tracks.splice(idx, 1);

  // re-render all tracks
  const container = document.getElementById('tracks');
  container.innerHTML = '';
  if (tracks.length === 0) {
    container.innerHTML = '<div class="empty-hint" id="emptyHint">Premi REC per registrare la prima traccia</div>';
  } else {
    tracks.forEach((_, i) => renderTrack(i));
  }
  updateTrackCount();
  setStatus('Traccia eliminata');
}

// ─── Playback ─────────────────────────────────────────────────────────────────
function playAll() {
  if (tracks.length === 0) { setStatus('Nessuna traccia'); return; }
  stopAll();
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const anySolo = tracks.some(t => t.solo);
  const maxDur = Math.max(...tracks.filter(t=>t.buffer).map(t => t.buffer.duration));
  tracks.forEach((t, i) => {
    if (!t.buffer) return;
    const src = ctx.createBufferSource();
    src.buffer = t.buffer;
    const gain = ctx.createGain();
    const active = !t.muted && (!anySolo || t.solo);
    gain.gain.value = active ? t.gain : 0;
    src.connect(gain).connect(ctx.destination);
    src.start(0);
    t.sourceNode = src;
    t.gainNode = gain;
    src.onended = () => {
      if (i === tracks.length - 1) {
        isPlaying = false;
        stopTimer();
        resetTimer();
        setStatus('PRONTO');
      }
    };
  });
  isPlaying = true;
  startTimer(maxDur);
  setStatus('▶ RIPRODUZIONE...');
}

function stopAll() {
  if (isRecording) { stopRecording(); return; }
  tracks.forEach(t => {
    try { t.sourceNode?.stop(); } catch(e){}
    t.sourceNode = null; t.gainNode = null;
  });
  isPlaying = false;
  stopTimer();
  resetTimer();
  setStatus('PRONTO');
}

function stopRecording() {
  if (!isRecording) return;
  tracks.forEach(t => { try { t.sourceNode?.stop(); } catch(e){} t.sourceNode = null; t.gainNode = null; });
  mediaRecorder.stop();
  mediaStream.getTracks().forEach(t => t.stop());
  isRecording = false;
  stopVU();
  stopTimer();
  resetTimer();
  document.getElementById('btnRec').classList.remove('recording');
  document.getElementById('btnRecPlay').classList.remove('recording');
  setStatus('Elaborazione...');
}

// ─── Mix & Download ───────────────────────────────────────────────────────────
async function mixAndDownload() {
  const active = tracks.filter(t => t.buffer);
  if (active.length === 0) { setStatus('Nessuna traccia'); return; }
  setStatus('Mixaggio...');
  const ctx = getCtx();
  const duration = Math.max(...active.map(t => t.buffer.duration));
  const sampleRate = ctx.sampleRate;
  const length = Math.ceil(duration * sampleRate);
  const offline = new OfflineAudioContext(2, length, sampleRate);
  const anySolo = active.some(t => t.solo);

  active.forEach(t => {
    const src = offline.createBufferSource();
    src.buffer = t.buffer;
    const gain = offline.createGain();
    const active2 = !t.muted && (!anySolo || t.solo);
    gain.gain.value = active2 ? t.gain : 0;
    src.connect(gain).connect(offline.destination);
    src.start(0);
  });

  const rendered = await offline.startRendering();
  const wavBlob = bufferToWav(rendered);
  const url = URL.createObjectURL(wavBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'overdub-mix.wav';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('Mix scaricato!');
}

function bufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = length * numChannels * bitsPerSample / 8;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);

  function writeStr(o, s) { for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  writeStr(0,'RIFF'); view.setUint32(4, 36+dataSize, true);
  writeStr(8,'WAVE'); writeStr(12,'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true); writeStr(36,'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i=0; i<length; i++) {
    for (let ch=0; ch<numChannels; ch++) {
      const s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(offset, s < 0 ? s*32768 : s*32767, true);
      offset += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

function clearAll() {
  if (tracks.length === 0) return;
  stopAll();
  tracks = [];
  const container = document.getElementById('tracks');
  container.innerHTML = '<div class="empty-hint" id="emptyHint">Premi REC per registrare la prima traccia</div>';
  updateTrackCount();
  setStatus('PRONTO');
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function updateTrackCount() {
  document.getElementById('trackCount').textContent = tracks.length + ' tracc' + (tracks.length===1?'ia':'e');
}
</script>
